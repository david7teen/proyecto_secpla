{% extends 'base_secpla.html' %}
{% block title %}Crear nuevo Territorial{% endblock %}

{% block content %}
<div class="form-container">
  <div class="formulario-departamento">
    <h2>Crear nuevo Territorial</h2>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" name="nombre_territorial" required>
      </div>

      <div class="form-group">
        <label>Apellido:</label>
        <input type="text" name="apellido_territorial" required>
      </div>

      <div class="form-group">
        <label>Correo:</label>
        <input type="email" name="correo_territorial" required>
      </div>

      <div class="form-group">
        <label>Teléfono:</label>
        <input type="text" name="telefono_territorial" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Crear Territorial</button>
        <a href="/perfil/secpla/" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
