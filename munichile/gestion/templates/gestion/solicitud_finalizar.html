<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Finalizar Solicitud</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 24px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Finalizar Solicitud #{{ obj.id }}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label>Tipo de Archivo:</label>
            {{ form.tipo }}
        </div>
        <div class="form-group">
            <label>Archivo:</label>
            {{ form.ruta_archivo }}
        </div>
        <div class="form-group">
            <label>Descripción del Trabajo Realizado:</label>
            {{ form.descripcion }}
        </div>
        
        <div class="actions">
            <button type="submit" class="btn">Finalizar Solicitud</button>
            <a href="{% url 'gestion_solicitud_list' %}">Cancelar</a>
        </div>
    </form>
</body>
</html>
