<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Eliminar Pregunta</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 24px auto; }
        .btn { padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        .cancel-btn { background: #95a5a6; text-decoration: none; padding: 10px 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Eliminar Pregunta</h1>
    <p>¿Seguro que deseas eliminar la pregunta: <strong>"{{ obj.texto_pregunta }}"</strong>?</p>
    <p>Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn">Sí, eliminar</button>
        <a href="{% url 'gestion_encuesta_detail' encuesta.id %}" class="cancel-btn">Cancelar</a>
    </form>
</body>
</html>
