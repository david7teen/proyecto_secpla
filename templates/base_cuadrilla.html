{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Panel Cuadrilla{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/compiled.css' %}">
  {% block extra_styles %}{% endblock %}
</head>
<body>
<!-- Botón del menú -->
<button id="menu-toggle" class="menu-toggle">☰</button>

<div class="sidebar" id="sidebar-menu">
  <h2></h2>   
  <a href="/perfil/cuadrilla/">Inicio</a>
  <a href="/cuadrilla/incidencias/activas/">Incidencias en curso</a>
  <a href="/cuadrilla/incidencias/finalizadas/">Incidencias finalizadas</a>
  <a href="/" class="logout-link">Cerrar sesión</a>
</div>
<div class="main-content">
  {% block content %}
  {% endblock %}
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const toggleButton = document.getElementById('menu-toggle');
    const sidebar = document.getElementById('sidebar-menu');

    toggleButton.addEventListener('click', function () {
      if (sidebar.style.left === '0px') {
        sidebar.style.left = '-250px';
      } else {
        sidebar.style.left = '0px';
      }
    });
  });
</script>
</body>
</html>
