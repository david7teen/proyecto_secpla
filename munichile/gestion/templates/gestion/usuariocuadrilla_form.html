<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Asignar Usuario a Cuadrilla</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 24px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Asignar Usuario a Cuadrilla</h1>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Usuario:</label>
            {{ form.usuario }}
        </div>
        <div class="form-group">
            <label>Cuadrilla:</label>
            {{ form.cuadrilla }}
        </div>
        
        <div class="actions">
            <button type="submit" class="btn">Asignar</button>
            <a href="{% url 'gestion_usuariocuadrilla_list' %}">Cancelar</a>
        </div>
    </form>
</body>
</html>
