{% extends 'base_secpla.html' %}
{% block title %}Editar Incidencia{% endblock %}

{% block content %}
<div class="usuario-editar-card">
  <h2>✏️ Editar Incidencia</h2>

  <form method="POST" class="form-edicion">
    {% csrf_token %}

    <div class="form-group">
      <label for="nombre_incidencia">Título de la Incidencia:</label>
      <input type="text" id="nombre_incidencia" name="nombre_incidencia" value="{{ incidencia.nombre_incidencia|default_if_none:'' }}" required>
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" name="descripcion" rows="4" required>{{ incidencia.descripcion|default_if_none:'' }}</textarea>
    </div>

    <div class="form-group">
      <label for="direccion_incidencia">Dirección asociada:</label>
      <select id="direccion_incidencia" name="direccion_incidencia" required>
        {% for d in direcciones %}
          <option value="{{ d.id }}" {% if incidencia.direccion_incidencia.id == d.id %}selected{% endif %}>
            {{ d.nombre_direccion }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="departamento_incidencia">Departamento responsable:</label>
      <select id="departamento_incidencia" name="departamento_incidencia" required>
        {% for dep in departamentos %}
          <option value="{{ dep.id }}" {% if incidencia.departamento_incidencia.id == dep.id %}selected{% endif %}>
            {{ dep.nombre_departamento }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="estado">Estado:</label>
      <select id="estado" name="estado">
        <option value="Activo" {% if incidencia.estado == "Activo" %}selected{% endif %}>Activo</option>
        <option value="Inactivo" {% if incidencia.estado == "Inactivo" %}selected{% endif %}>Inactivo</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-editar">💾 Guardar cambios</button>
      <a href="{% url 'listar_incidencias' %}" class="btn btn-volver">⬅️ Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
