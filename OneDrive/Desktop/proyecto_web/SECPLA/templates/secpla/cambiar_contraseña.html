{% extends 'base.html' %}

{% block title %}Cambiar contraseña{% endblock %}

{% block content %}
<div class="formulario-departamento">
  <h2>Cambiar contraseña para {{ usuario.correo }}</h2>

  {% if messages %}
    {% for message in messages %}
      <p class="alert alert-warning">{{ message }}</p>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="nueva_contraseña">Nueva contraseña:</label>
      <input type="password" name="nueva_contraseña" required>
    </div>

    <div class="form-group">
      <label for="confirmar_contraseña">Confirmar contraseña:</label>
      <input type="password" name="confirmar_contraseña" required>
    </div>

    <div class="form-actions">
      <button type="submit">Actualizar</button>
      <a href="/secpla/ver_usuarios/" class="btn">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
