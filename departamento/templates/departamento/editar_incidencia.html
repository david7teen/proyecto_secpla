{% extends 'base.html' %} {% block title %}Editar Incidencia{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; padding: 20px;">
    <div class="usuario-detalle-card">
        <h2>Editar Incidencia #{{ inc.id }}</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="nombre_incidencia" style="font-weight: bold;">Título:</label>
                <input type="text" name="nombre_incidencia" value="{{ inc.nombre_incidencia }}" class="form-control" style="width: 100%; padding: 8px; box-sizing: border-box;">
            </div>
            
            <div class="form-group" style="margin-bottom: 15px;">
                <label for="descripcion" style="font-weight: bold;">Descripción:</label>
                <textarea name="descripcion" class="form-control" style="width: 100%; padding: 8px; box-sizing: border-box;" rows="5">{{ inc.descripcion }}</textarea>
            </div>
            
            <div class="usuario-acciones">
                <button type="submit" class="btn btn-success">Guardar Cambios</button>
                <a href="{% url 'ver_rechazadas_departamento' %}" class="btn btn-volver">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
