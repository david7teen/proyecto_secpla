{% extends 'base.html' %} 
{% block title %}Editar Incidencia{% endblock %}

{% block content %}
<div class="form-container">
    <div class="usuario-editar-card">
        <h2>Editar Incidencia #{{ inc.id }}</h2>
        
        <form method="POST" class="form-edicion">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="nombre_incidencia">Título:</label>
                <input type="text" name="nombre_incidencia" value="{{ inc.nombre_incidencia }}" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea name="descripcion" class="form-control" rows="5" required>{{ inc.descripcion }}</textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                <a href="{% url 'ver_rechazadas_departamento' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
