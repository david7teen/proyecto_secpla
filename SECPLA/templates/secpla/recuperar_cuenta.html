{% extends 'base.html' %}

{% block title %}Recuperar cuenta - Perfil {{ perfil }}{% endblock %}

{% block content %}
<div class="formulario-departamento">
  <h2>Recuperar cuenta - Perfil: {{ perfil }}</h2>

  {% if mensaje %}
    <p class="alert alert-warning">{{ mensaje }}</p>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="form-group">
      <label for="correo">Correo registrado:</label>
      <input type="email" id="correo" name="correo" required>
    </div>

    <input type="hidden" name="perfil" value="{{ perfil }}">

    <div class="form-actions">
      <button type="submit">Enviar solicitud</button>
      <a href="/" class="btn">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
