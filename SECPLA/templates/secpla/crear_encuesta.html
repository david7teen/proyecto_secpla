{% extends 'base_secpla.html' %}
{% block title %}Crear nueva Encuesta{% endblock %}
{% block content %}
<div class="form-container">
  <form method="POST" action="{% url 'crear_encuesta' %}" enctype="multipart/form-data" class="formulario-encuesta">
    <h2>Crear nueva Encuesta</h2>
    {% csrf_token %}
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="form-group">
      <label>Nombre:</label>
      <input type="text" name="nombre_encuesta" required>
    </div>

    <div class="form-group">
      <label>Descripción:</label>
      <textarea name="descripcion_incidente"></textarea>
    </div>

    <div class="form-group">
      <label>Ubicación:</label>
      <input type="text" name="ubicacion" required>
    </div>

    <div class="form-group">
      <label>Imagen:</label>
      <input type="file" name="imagen">
    </div>

    <div class="form-group">
      <label>Video:</label>
      <input type="file" name="video">
    </div>

    <div class="form-group">
      <label>Audio:</label>
      <input type="file" name="audio">
    </div>

    <div class="form-group">
      <label>Preguntas:</label>
      <div id="contenedorPreguntas">
        <div class="bloque-pregunta">
          <select name="preguntas[]">
            <option value="" disabled selected>Seleccione una pregunta</option>
            {% for p in preguntas %}
              <option value="{{ p.id }}">{{ p.nombre_pregunta }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="pregunta-actions">
        <button type="button" onclick="agregarCampoPregunta()" class="btn btn-sm btn-secondary">Agregar otra pregunta</button>
        <a href="{% url 'crear_pregunta_desde_encuesta' %}" class="btn btn-sm btn-primary">Crear nueva pregunta</a>
      </div>
    </div>

    <div class="form-group">
      <label for="prioridad">Prioridad:</label>
      <select id="prioridad" name="prioridad" required>
        <option value="">Seleccione una opción</option>
        <option value="Alta">Alta</option>
        <option value="Normal">Normal</option>
        <option value="Baja">Baja</option>
      </select>
    </div>

    <div class="form-group">
      <label for="datos_vecino">Datos del vecino (Nombre - Celular - Email):</label>
      <input type="text" name="datos_vecino" id="datos_vecino" pattern=".+ - .+ - .+">
    </div>

    <div class="form-group">
      <label for="tipo_incidencia">Tipo de incidencia:</label>
      <select id="tipo_incidencia" name="tipo_incidencia" required>
        <option value="">Seleccione una incidencia</option>
        {% for i in incidencias %}
          <option value="{{ i.id }}">{{ i.nombre }}</option>
        {% endfor %}
      </select>
      <button type="button" onclick="abrirModalTipo()" class="btn btn-sm btn-primary">Crear nuevo tipo</button>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Crear Encuesta</button>
      <a href="/perfil/secpla/" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

<div id="modalTipo" class="modal">
  <form id="formTipo" method="post" action="{% url 'crear_tipo_incidencia_ajax' %}">
    {% csrf_token %}
    <label for="nombre_tipo">Nombre del nuevo tipo:</label>
    <input type="text" name="nombre_tipo" id="nombre_tipo" required>

    <label for="direccion_tipo">Dirección:</label>
    <select name="direccion_tipo" id="direccion_tipo" required onchange="cargarDepartamentos()">
      <option value="">Seleccione una dirección</option>
      {% for d in direcciones %}
        <option value="{{ d.id }}">{{ d.nombre_direccion }}</option>
      {% endfor %}
    </select>

    <label for="departamento_tipo">Departamento:</label>
    <select name="departamento_tipo" id="departamento_tipo" required disabled>
      <option value="">Seleccione un departamento</option>
    </select>
    
    <div class="modal-actions">
      <button type="button" onclick="cerrarModalTipo()" class="btn btn-secondary">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>
</div>

<script>
function agregarCampoPregunta() {
  const contenedor = document.getElementById("contenedorPreguntas");
  const nuevoBloque = document.createElement("div");
  nuevoBloque.classList.add("bloque-pregunta");

  nuevoBloque.innerHTML = `
    <select name="preguntas[]" required>
      <option value="" disabled selected>Seleccione una pregunta</option>
      {% for p in preguntas %}
        <option value="{{ p.id }}">{{ p.nombre_pregunta }}</option>
      {% endfor %}
    </select>
  `;

  contenedor.appendChild(nuevoBloque);
}

function abrirModalTipo() {
  document.getElementById("modalTipo").style.display = "flex";
}

function cerrarModalTipo() {
  document.getElementById("modalTipo").style.display = "none";
}

document.getElementById("formTipo").addEventListener("submit", function(e) {
  e.preventDefault();
  const form = e.target;
  const nombre = document.getElementById("nombre_tipo").value.trim();

  if (!nombre) {
    alert("Debes ingresar el nombre del tipo.");
    return;
  }

  const data = new FormData(form);

  fetch(form.action, {
    method: "POST",
    headers: {
      "X-CSRFToken": data.get("csrfmiddlewaretoken")
    },
    body: data
  })
  .then(response => response.json())
  .then(data => {
    console.log("Respuesta del backend:", data);
    if (data.id) {
      const select = document.getElementById("tipo_incidencia");
      const option = document.createElement("option");
      option.value = data.id;
      option.text = data.nombre;
      option.selected = true;
      select.appendChild(option);
      cerrarModalTipo();
    } else if (data.error) {
      alert(data.error);
    }
  })
  .catch(() => alert("Error de conexión al crear el tipo."));
});

function cargarDepartamentos() {
  const direccionId = document.getElementById("direccion_tipo").value;
  const departamentoSelect = document.getElementById("departamento_tipo");

  departamentoSelect.innerHTML = '<option value="">Cargando...</option>';
  departamentoSelect.disabled = true;

  if (!direccionId) return;

  fetch(`/secpla/api/departamentos_por_direccion/${direccionId}/`)
    .then(response => response.json())
    .then(data => {
      departamentoSelect.innerHTML = '<option value="">Seleccione un departamento</option>';

      data.forEach(dep => {
        const option = document.createElement("option");
        option.value = dep.id;
        option.text = dep.nombre;
        departamentoSelect.appendChild(option);
      });

      departamentoSelect.disabled = false;
    })
    .catch((error) => {
      console.error("Error al cargar departamentos:", error);
      departamentoSelect.innerHTML = '<option value="">Error al cargar</option>';
    });
}
</script>
{% endblock %}
