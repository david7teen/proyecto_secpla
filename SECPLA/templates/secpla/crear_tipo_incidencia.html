{% extends 'base_secpla.html' %}
{% block title %}Crear Tipo de Incidencia{% endblock %}

{% block content %}
<div class="formulario-departamento">
  <h2>Crear Nuevo Tipo de Incidencia</h2>

  {% if messages %}
    {% for message in messages %}
      <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %}">
          {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="nombre">Nombre del Tipo de Incidencia:</label>
      <input type="text" name="nombre" id="nombre" required>
    </div>
    <div class="form-group">
      <label for="descripcion">Descripción (opcional):</label>
      <textarea name="descripcion" id="descripcion" rows="3"></textarea>
    </div>
    <div class="form-group">
      <label for="id_direccion">Dirección asociada:</label>
      <select name="direccion" id="id_direccion" required>
        <option value="">Seleccione una dirección...</option>
        {% for dir in direcciones %}
          <option value="{{ dir.id }}">{{ dir.nombre_direccion }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="id_departamento">Departamento asociado:</label>
      <select name="departamento" id="id_departamento" required>
        <option value="">Seleccione una dirección primero...</option>
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-secondary">Crear</button>
      <a href="{% url 'listar_tipos_incidencia' %}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const direccionSelect = document.querySelector('#id_direccion');
    const departamentoSelect = document.querySelector('#id_departamento');
    
    // 1. Usamos el 'name' de la URL que acabamos de arreglar en urls.py
    // El '0' es un marcador de posición que vamos a reemplazar.
    const baseUrl = "{% url 'api_departamentos_por_direccion' 0 %}";

    direccionSelect.addEventListener('change', function() {
        const direccionId = this.value;
        departamentoSelect.innerHTML = '<option value="">Cargando...</option>';
        departamentoSelect.disabled = true;

        if (direccionId) {
            // 2. Reemplazamos el '0' con el ID de la dirección seleccionada
            const fetchUrl = baseUrl.replace('0', direccionId); 

            // 3. Hacemos el fetch a la URL correcta (ej. /api/departamentos_por_direccion/1/)
            fetch(fetchUrl) 
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Respuesta del servidor no fue OK');
                    }
                    return response.json();
                })
                .then(data => {
                    departamentoSelect.innerHTML = '<option value="">Seleccione departamento</option>';
                    data.forEach(dep => {
                        departamentoSelect.add(new Option(dep.nombre, dep.id));
                    });
                    departamentoSelect.disabled = false; // Habilitamos el combo
                })
                .catch(error => {
                    console.error('Error:', error);
                    // Esto es lo que estás viendo: "Error al cargar"
                    departamentoSelect.innerHTML = '<option value="">Error al cargar</option>';
                });
        } else {
            // Si el usuario no selecciona nada
            departamentoSelect.innerHTML = '<option value="">Seleccione una dirección primero</option>';
        }
    });
});
</script>
{% endblock %}
