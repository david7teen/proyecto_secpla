<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% if modo == 'crear' %}Nueva Pregunta{% else %}Editar Pregunta{% endif %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 24px auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .delete-btn { background: #e74c3c; margin-left: 10px; }
    </style>
</head>
<body>
    <h1>{% if modo == 'crear' %}Nueva Pregunta{% else %}Editar Pregunta{% endif %}</h1>
    <p><strong>Encuesta:</strong> {{ encuesta.titulo }}</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Texto de la Pregunta:</label>
            {{ form.texto_pregunta }}
        </div>
        <div class="form-group">
            <label>Tipo de Respuesta:</label>
            {{ form.tipo_respuesta }}
        </div>
        <div class="form-group" id="opciones-group" style="display: none;">
            <label>Opciones (separadas por coma):</label>
            {{ form.opciones }}
        </div>
        <div class="form-group">
            <label>Orden:</label>
            {{ form.orden }}
        </div>
        
        <div class="actions">
            <button type="submit" class="btn">{% if modo == 'crear' %}Crear{% else %}Guardar{% endif %}</button>
            {% if modo == 'editar' %}
            <a href="{% url 'gestion_pregunta_delete' encuesta.id obj.id %}" class="btn delete-btn">Eliminar</a>
            {% endif %}
            <a href="{% url 'gestion_encuesta_detail' encuesta.id %}">Cancelar</a>
        </div>
    </form>

    <script>
        document.getElementById('id_tipo_respuesta').addEventListener('change', function() {
            const opcionesGroup = document.getElementById('opciones-group');
            opcionesGroup.style.display = this.value === 'opciones' ? 'block' : 'none';
        });
        
        // Trigger on load
        document.getElementById('id_tipo_respuesta').dispatchEvent(new Event('change'));
    </script>
</body>
</html>
