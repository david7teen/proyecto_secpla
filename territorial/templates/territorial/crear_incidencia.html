{% extends 'base_territorial.html' %}
{% load static %}

{% block title %}Crear Nueva Incidencia{% endblock %}

{% block content %}
<div class="form-container">
  <div class="formulario-departamento">
    <h2>Crear Nueva Incidencia</h2>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label>Título de la Incidencia *</label>
        <input type="text" name="nombre_incidencia" required>
      </div>

      <div class="form-group">
        <label>Descripción *</label>
        <textarea name="descripcion" rows="4" required style="font-size:14px;">{{ descripcion|default_if_none:'' }}</textarea>
      </div>

      <div class="form-group">
        <label>Tipo de Incidencia</label>
        <select name="tipo_incidencia">
          <option value="">Seleccione un tipo</option>
          {% for tipo in tipos_incidencia %}
            <option value="{{ tipo.id }}">{{ tipo.nombre }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="ubicacion">Ubicación *</label>
        <input type="text" name="ubicacion" id="ubicacion" required 
             placeholder="Ej: Las Condes, Avenida Kennedy, #1234">
      </div>

      <div class="form-group">
        <label>Dirección *</label>
        <select id="direccion_incidencia" name="direccion_incidencia" required onchange="cargarDepartamentos()">
          <option value="">Seleccione una dirección</option>
          {% for direccion in direcciones %}
            <option value="{{ direccion.id }}">{{ direccion.nombre_direccion }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Departamento *</label>
        <select id="departamento_incidencia" name="departamento_incidencia" required>
          <option value="">Primero seleccione una dirección</option>
          {% for departamento in departamentos %}
            <option value="{{ departamento.id }}">{{ departamento.nombre_departamento }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Prioridad</label>
        <select name="prioridad">
          <option value="Baja">Baja</option>
          <option value="Normal" selected>Normal</option>
          <option value="Alta">Alta</option>
        </select>
      </div>

      <div class="form-group">
        <label>Datos del Vecino</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <input type="text" name="datos_vecino_nombre" placeholder="Nombre" style="flex:1; min-width:180px;">
          <input type="text" name="datos_vecino_celular" placeholder="Celular" style="width:160px;">
          <input type="email" name="datos_vecino_email" placeholder="Email" style="flex:1; min-width:180px;">
        </div>
      </div>
      
      <div class="form-group">
        <label>Archivos adjuntos</label>
      </div>

      <div style="margin-bottom: 10px;">
        <label>Imagen:</label>
        <input type="file" name="imagen" accept="image/*">
      </div>
      
      <div style="margin-bottom: 10px;">
        <label>Video:</label>
        <input type="file" name="video" accept="video/*">
	  </div>
    
      <div style="margin-bottom: 10px;">
        <label>Audio:</label>
        <input type="file" name="audio" accept="audio/*">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-secondary" style="border:none; font-size:14px;">Crear</button>
        <a href="{% url 'dashboard_territorial' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<script>
	
document.addEventListener('DOMContentLoaded', function() {
    const ubicacionInput = document.getElementById('ubicacion');
    const form = document.querySelector('form');
    
    if (!ubicacionInput) return;

    function validarFormatoUbicacion(ubicacion) {
        if (!ubicacion.trim()) return true;
        
        const partes = ubicacion.trim().split(',').map(p => p.trim());
        if (partes.length !== 3) return false;
        
        const [comuna, calle, numero] = partes;
        
        return comuna.length > 0 && 
               calle.length > 0 && 
               numero.startsWith('#') && 
               /^\d+$/.test(numero.slice(1));
    }

    function formatearUbicacion(ubicacion) {
        return ubicacion.split(', ').map(parte => 
            parte.replace(/\b\w/g, char => char.toUpperCase())
        ).join(', ');
    }

    ubicacionInput.addEventListener('blur', function() {
        const valor = this.value.trim();
        if (valor && !validarFormatoUbicacion(valor)) {
            alert('Formato incorrecto. Use: Comuna, Calle, #Número\n\nEjemplo: Las Condes, Avenida Kennedy, #1234');
            this.focus();
        } else if (valor) {
            this.value = formatearUbicacion(valor);
        }
    });

    form.addEventListener('submit', function(e) {
        const ubicacion = ubicacionInput.value.trim();
        
        if (ubicacion && !validarFormatoUbicacion(ubicacion)) {
            e.preventDefault();
            alert('Formato de ubicación incorrecto\n\nUse: Comuna, Calle, #Número\nEjemplo: Las Condes, Avenida Kennedy, #1234');
            ubicacionInput.focus();
            return false;
        }
        
        if (ubicacion) {
            ubicacionInput.value = formatearUbicacion(ubicacion);
        }
    });
});	
	
function cargarDepartamentos() {
  const direccionId = document.getElementById('direccion_incidencia').value;
  const departamentoSelect = document.getElementById('departamento_incidencia');

  console.log('Cargando departamentos para dirección:', direccionId);

  if (!direccionId) {
    departamentoSelect.innerHTML = '<option value="">Seleccione una dirección primero</option>';
    departamentoSelect.disabled = true;
    return;
  }

  departamentoSelect.innerHTML = '<option value="">Cargando departamentos...</option>';
  departamentoSelect.disabled = false;

  fetch(`/territorial/api/departamentos/${direccionId}/`)
    .then(response => {
      if (!response.ok) {
        throw new Error('Error en la respuesta del servidor');
      }
      return response.json();
    })
    .then(data => {
      console.log('Departamentos recibidos:', data);
      
      if (data.length === 0) {
        departamentoSelect.innerHTML = '<option value="">No hay departamentos para esta dirección</option>';
      } else {
        departamentoSelect.innerHTML = '<option value="">Seleccione un departamento</option>';
        
        data.forEach(dep => {
          const option = document.createElement('option');
          option.value = dep.id;
          option.text = dep.nombre;
          departamentoSelect.appendChild(option);
        });
      }
    })
    .catch((error) => {
      console.error('Error al cargar departamentos:', error);
      departamentoSelect.innerHTML = '<option value="">Error al cargar departamentos</option>';
    });
}

document.addEventListener('DOMContentLoaded', function() {
  console.log('Página de crear incidencia cargada');
});
</script>
{% endblock %}
