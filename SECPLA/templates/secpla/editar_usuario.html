{% extends 'base_secpla.html' %}
{% block title %}Editar Usuario{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; padding: 20px;">
    <div class="usuario-detalle-card" style="width: 600px;">
        <h2>Editar Usuario</h2>

        <form method="POST" class="form-edicion">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" name="nombre" id="nombre" class="form-control" value="{{ usuario.nombre }}" required>
            </div>
            
            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" name="apellido" id="apellido" class="form-control" value="{{ usuario.apellido }}" required>
            </div>
            
            <div class="form-group">
                <label for="correo">Correo:</label>
                <input type="email" name="correo" id="correo" class="form-control" value="{{ usuario.correo }}" required>
            </div>
            
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" name="telefono" id="telefono" class="form-control" value="{{ usuario.telefono }}">
            </div>
            
            <div class="form-group">
                <label for="id_perfil">Perfil:</label>
                <select name="perfil" id="id_perfil" class="form-control" required>
                    <option value="SECPLA" {% if usuario.perfil == 'SECPLA' %}selected{% endif %}>SECPLA</option>
                    <option value="Dirección" {% if usuario.perfil == 'Dirección' %}selected{% endif %}>Dirección</option>
                    <option value="Departamento" {% if usuario.perfil == 'Departamento' %}selected{% endif %}>Departamento</option>
                    <option value="Territorial" {% if usuario.perfil == 'Territorial' %}selected{% endif %}>Territorial</option>
                    <option value="Cuadrilla" {% if usuario.perfil == 'Cuadrilla' %}selected{% endif %}>Cuadrilla</option>
                </select>
            </div>

            <div class="form-group" id="direccion-group" style="display: none;">
                <label for="direccion_asociada">Dirección asociada:</label>
                <select name="direccion_asociada" id="id_direccion_asociada" class="form-control">
                    <option value="">(Opcional) Asignar dirección</option>
                    {% for dir in direcciones %}
                        <option value="{{ dir.id }}" {% if usuario.direccion_asociada.id == dir.id %}selected{% endif %}>
                            {{ dir.nombre_direccion }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group" id="departamento-group" style="display: none;">
                <label for="departamento_asociado">Departamento asociado:</label>
                <select name="departamento_asociado" id="id_departamento_asociado" class="form-control">
                    <option value="">(Opcional) Asignar departamento</option>
                    {% for dep in departamentos %}
                        <option value="{{ dep.id }}" {% if usuario.departamento_asociado.id == dep.id %}selected{% endif %}>
                            {{ dep.nombre_departamento }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-secondary">Crear</button>
                <a href="{% url 'ver_usuario' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const perfilSelect = document.querySelector('#id_perfil');
    const dirGroup = document.querySelector('#direccion-group');
    const deptoGroup = document.querySelector('#departamento-group');

    function toggleFields() {
        const perfil = perfilSelect.value;
        
        if (perfil === 'Dirección') {
            dirGroup.style.display = 'block';
        } else {
            dirGroup.style.display = 'none';
        }

        if (perfil === 'Departamento' || perfil === 'Cuadrilla') {
            deptoGroup.style.display = 'block';
        } else {
            deptoGroup.style.display = 'none';
        }
    }

    perfilSelect.addEventListener('change', toggleFields);
    toggleFields();
});
</script>
{% endblock %}
