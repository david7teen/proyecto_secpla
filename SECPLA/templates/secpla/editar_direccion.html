{% extends 'base_secpla.html' %}
{% block title %}Editar Dirección{% endblock %}

{% block content %}
<div class="usuario-editar-card">
  <h2>✏️ Editar Dirección</h2>

  <form method="POST" class="form-edicion">
    {% csrf_token %}

    <div class="form-group">
      <label for="nombre_direccion">Nombre Dirección:</label>
      <input type="text" id="nombre_direccion" name="nombre_direccion" value="{{ direccion.nombre_direccion }}" required>
    </div>

    <div class="form-group">
      <label for="nombre_encargado">Nombre Encargado:</label>
      <input type="text" id="nombre_encargado" name="nombre_encargado" value="{{ direccion.nombre_encargado }}" required>
    </div>

    <div class="form-group">
      <label for="correo_encargado">Correo Encargado:</label>
      <input type="email" id="correo_encargado" name="correo_encargado" value="{{ direccion.correo_encargado }}" required>
    </div>

    <div class="form-group">
      <label for="estado">Estado:</label>
      <select id="estado" name="estado">
        <option value="Activo" {% if direccion.estado == "Activo" %}selected{% endif %}>Activo</option>
        <option value="Inactivo" {% if direccion.estado == "Inactivo" %}selected{% endif %}>Inactivo</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-editar">💾 Guardar cambios</button>
      <a href="{% url 'vista_secpla' %}" class="btn btn-volver">⬅️ Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
