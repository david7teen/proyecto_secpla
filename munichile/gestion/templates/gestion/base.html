<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MuniChile{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: system-ui, sans-serif; 
            background: #f5f5f5; 
            color: #333;
            line-height: 1.6;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        .header { 
            background: #2c3e50; 
            color: white; 
            padding: 1rem 0; 
        }
        .nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .nav-brand { font-size: 1.5rem; font-weight: bold; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { 
            color: white; 
            text-decoration: none; 
            padding: 5px 10px;
        }
        .nav-links a:hover { background: rgba(255,255,255,0.1); }
        .content { 
            background: white; 
            padding: 2rem; 
            margin-top: 20px;
            border-radius: 8px;
        }
        .messages { margin-bottom: 20px; }
        .alert { 
            padding: 12px 15px; 
            border-radius: 4px; 
            margin-bottom: 10px;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background: #2980b9; }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .table th, .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .table th {
            background: #f8f9fa;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-brand">MuniChile</div>
            <div class="nav-links">
                <a href="{% url 'gestion_main' %}">Inicio</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'check_profile' %}">Dashboard</a>
                    <span>{{ user.username }}</span>
                    <a href="{% url 'logout' %}">Salir</a>
                {% else %}
                    <a href="{% url 'login' %}">Ingresar</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <div class="container">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
