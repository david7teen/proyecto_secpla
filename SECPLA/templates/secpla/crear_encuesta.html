{% extends 'base_secpla.html' %}
{% block title %}Crear nueva Encuesta{% endblock %}
{% block content %}
<div class="form-container">
  <form method="POST" action="{% url 'crear_encuesta' %}" enctype="multipart/form-data" class="formulario-encuesta" id="formEncuesta">
    <h2>Crear nueva Encuesta</h2>
    {% csrf_token %}
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="form-group">
      <label>Nombre:</label>
      <input type="text" name="nombre_encuesta" required>
    </div>

    <div class="form-group">
      <label>Descripción:</label>
      <textarea name="descripcion_incidente"></textarea>
    </div>

    <div class="form-group">
      <label>Ubicación:</label>
      <input type="text" name="ubicacion" required>
    </div>

    <div class="form-group">
      <label>Imagen:</label>
      <input type="file" name="imagen">
    </div>

    <div class="form-group">
      <label>Video:</label>
      <input type="file" name="video">
    </div>

    <div class="form-group">
      <label>Audio:</label>
      <input type="file" name="audio">
    </div>

    <div class="form-group">
      <label>Preguntas:</label>
      <div id="contenedorPreguntas">
        <div class="bloque-pregunta">
          <select name="preguntas[]">
            <option value="" disabled selected>Seleccione una pregunta</option>
            {% for p in preguntas %}
              <option value="{{ p.id }}">{{ p.nombre_pregunta }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="pregunta-actions">
        <button type="button" onclick="agregarCampoPregunta()" class="btn btn-sm btn-secondary">Agregar otra pregunta</button>
        <button type="button" onclick="abrirModalPregunta()" class="btn btn-sm btn-secondary">Crear nueva pregunta</button>
      </div>
    </div>

    <div class="form-group">
      <label for="prioridad">Prioridad:</label>
      <select id="prioridad" name="prioridad" required>
        <option value="">Seleccione una opción</option>
        <option value="Alta">Alta</option>
        <option value="Normal">Normal</option>
        <option value="Baja">Baja</option>
      </select>
    </div>

    <div class="form-group">
      <label>Datos del vecino:</label>
      <div class="datos-vecino-container">
        <div class="datos-vecino-field">
          <label for="vecino_nombre">Nombre</label>
          <input type="text" name="vecino_nombre" id="vecino_nombre" placeholder="Nombre">
        </div>
        <div class="datos-vecino-field">
          <label for="vecino_celular">Celular</label>
          <input type="text" name="vecino_celular" id="vecino_celular" placeholder="Celular">
        </div>
        <div class="datos-vecino-field">
          <label for="vecino_email">Email</label>
          <input type="email" name="vecino_email" id="vecino_email" placeholder="Email">
        </div>
      </div>
      <input type="hidden" name="datos_vecino" id="datos_vecino">
    </div>

    <div class="form-group">
      <label for="tipo_incidencia">Tipo de incidencia:</label>
      <select id="tipo_incidencia" name="tipo_incidencia" required>
        <option value="">Seleccione una incidencia</option>
        {% for i in incidencias %}
          <option value="{{ i.id }}">{{ i.nombre }}</option>
        {% endfor %}
      </select>
      <button type="button" onclick="abrirModalTipo()" class="btn btn-sm btn-primary">Crear nuevo tipo</button>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-secondary">Crear</button>
      <a href="/perfil/secpla/" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

<div id="modalPregunta" class="modal" style="display: none;">
  <form id="formPregunta" method="post" action="{% url 'crear_pregunta_ajax' %}">
    {% csrf_token %}
    <label for="nombre_pregunta">Nombre de la pregunta:</label>
    <input type="text" name="nombre_pregunta" id="nombre_pregunta" required>
    
    <div class="modal-actions">
      <button type="submit" class="btn btn-secondary">Guardar</button>
      <button type="button" onclick="cerrarModalPregunta()" class="btn btn-secondary">Cancelar</button>
    </div>
  </form>
</div>

<div id="modalTipo" class="modal" style="display: none;">
  <form id="formTipo" method="post" action="{% url 'crear_tipo_incidencia_ajax' %}">
    {% csrf_token %}
    <h3 style="margin-top: 0; margin-bottom: 20px;">Crear Nuevo Tipo de Incidencia</h3>
    
    <div class="form-group">
      <label for="nombre_tipo">Nombre:</label>
      <input type="text" name="nombre_tipo" id="nombre_tipo" required>
    </div>

    <div class="form-group">
      <label for="direccion_tipo">Dirección:</label>
      <select name="direccion_tipo" id="direccion_tipo" required onchange="cargarDepartamentos()">
        <option value="">Seleccione una dirección</option>
        {% for d in direcciones %}
          <option value="{{ d.id }}">{{ d.nombre_direccion }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="departamento_tipo">Departamento:</label>
      <select name="departamento_tipo" id="departamento_tipo" required disabled>
        <option value="">Seleccione un departamento</option>
      </select>
    </div>
    
    <div class="modal-actions">
      <button type="submit" class="btn btn-secondary">Guardar</button>
      <button type="button" onclick="cerrarModalTipo()" class="btn btn-secondary">Cancelar</button>
    </div>
  </form>
</div>

<script>
function actualizarDatosVecino() {
  const nombre = document.getElementById("vecino_nombre").value.trim();
  const celular = document.getElementById("vecino_celular").value.trim();
  const email = document.getElementById("vecino_email").value.trim();
  const datosCombinados = `${nombre} - ${celular} - ${email}`;
  document.getElementById("datos_vecino").value = datosCombinados;
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById("vecino_nombre").addEventListener('input', actualizarDatosVecino);
  document.getElementById("vecino_celular").addEventListener('input', actualizarDatosVecino);
  document.getElementById("vecino_email").addEventListener('input', actualizarDatosVecino);

  document.getElementById("formEncuesta").addEventListener('submit', actualizarDatosVecino);
});

let preguntasDisponibles = [
  {% for p in preguntas %}
    {id: {{ p.id }}, nombre: "{{ p.nombre_pregunta|escapejs }}"}{% if not forloop.last %},{% endif %}
  {% endfor %}
];

function agregarCampoPregunta() {
  const contenedor = document.getElementById("contenedorPreguntas");
  const nuevoBloque = document.createElement("div");
  nuevoBloque.classList.add("bloque-pregunta");

  let optionsHTML = '<option value="" disabled selected>Seleccione una pregunta</option>';
  preguntasDisponibles.forEach(p => {
    optionsHTML += `<option value="${p.id}">${p.nombre}</option>`;
  });

  nuevoBloque.innerHTML = `<select name="preguntas[]">${optionsHTML}</select>`;
  contenedor.appendChild(nuevoBloque);
}

function abrirModalPregunta() {
  document.getElementById("modalPregunta").style.display = "flex";
}

function cerrarModalPregunta() {
  document.getElementById("modalPregunta").style.display = "none";
  document.getElementById("nombre_pregunta").value = "";
}

document.getElementById("formPregunta").addEventListener("submit", function(e) {
  e.preventDefault();
  const form = e.target;
  const nombre = document.getElementById("nombre_pregunta").value.trim();

  if (!nombre) {
    alert("Debes ingresar el nombre de la pregunta.");
    return;
  }

  const data = new FormData(form);
  const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

  fetch(form.action, {
    method: "POST",
    headers: {
      "X-CSRFToken": csrfToken
    },
    body: data
  })
  .then(response => response.json())
  .then(data => {
    if (data.id) {
      preguntasDisponibles.push({id: data.id, nombre: data.nombre});
      
      const selects = document.querySelectorAll('select[name="preguntas[]"]');
      selects.forEach(select => {
        const option = document.createElement("option");
        option.value = data.id;
        option.text = data.nombre;
        option.selected = true;
        select.appendChild(option);
      });
      
      cerrarModalPregunta();
      alert("Pregunta creada exitosamente");
    } else if (data.error) {
      alert(data.error);
    }
  })
  .catch(() => alert("Error de conexión al crear la pregunta."));
});

function abrirModalTipo() {
  document.getElementById("modalTipo").style.display = "flex";
}

function cerrarModalTipo() {
  document.getElementById("modalTipo").style.display = "none";
}

document.getElementById("formTipo").addEventListener("submit", function(e) {
  e.preventDefault();
  const form = e.target;
  const nombre = document.getElementById("nombre_tipo").value.trim();

  if (!nombre) {
    alert("Debes ingresar el nombre del tipo.");
    return;
  }

  const data = new FormData(form);

  fetch(form.action, {
    method: "POST",
    headers: {
      "X-CSRFToken": data.get("csrfmiddlewaretoken")
    },
    body: data
  })
  .then(response => response.json())
  .then(data => {
    console.log("Respuesta del backend:", data);
    if (data.id) {
      const select = document.getElementById("tipo_incidencia");
      const option = document.createElement("option");
      option.value = data.id;
      option.text = data.nombre;
      option.selected = true;
      select.appendChild(option);
      cerrarModalTipo();
    } else if (data.error) {
      alert(data.error);
    }
  })
  .catch(() => alert("Error de conexión al crear el tipo."));
});

function cargarDepartamentos() {
  const direccionId = document.getElementById("direccion_tipo").value;
  const departamentoSelect = document.getElementById("departamento_tipo");

  departamentoSelect.innerHTML = '<option value="">Cargando...</option>';
  departamentoSelect.disabled = true;

  if (!direccionId) return;

  fetch(`/secpla/api/departamentos_por_direccion/${direccionId}/`)
    .then(response => response.json())
    .then(data => {
      departamentoSelect.innerHTML = '<option value="">Seleccione un departamento</option>';

      data.forEach(dep => {
        const option = document.createElement("option");
        option.value = dep.id;
        option.text = dep.nombre;
        departamentoSelect.appendChild(option);
      });

      departamentoSelect.disabled = false;
    })
    .catch((error) => {
      console.error("Error al cargar departamentos:", error);
      departamentoSelect.innerHTML = '<option value="">Error al cargar</option>';
    });
}
</script>
{% endblock %}
