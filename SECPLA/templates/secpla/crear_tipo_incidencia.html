{% extends 'base_secpla.html' %}
{% block title %}Crear Tipo de Incidencia{% endblock %}
{% block content %}
<div class="form-container">
  <div class="formulario-departamento">
    <h2>Crear nuevo Tipo de Incidencia</h2>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" name="nombre" required>
      </div>

      <div class="form-group">
        <label>Descripción:</label>
        <input type="text" name="descripcion">
      </div>

      <div class="form-group">
        <label>Dirección:</label>
        <select name="direccion" required>
          <option value="">Seleccione una dirección</option>
          {% for d in direcciones %}
            <option value="{{ d.id }}">{{ d.nombre }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label>Departamento:</label>
        <select name="departamento" required>
          <option value="">Seleccione un departamento</option>
          {% for dep in departamentos %}
            <option value="{{ dep.id }}">{{ dep.nombre }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'lista_tipos_incidencia' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
