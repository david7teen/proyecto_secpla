{% extends 'base_secpla.html' %}
{% block title %}Editar Tipo de Incidencia{% endblock %}

{% block content %}
<div class="usuario-editar-card">
  <h2>Editar Tipo de Incidencia</h2>
  
  <form method="POST" class="form-edicion">
    {% csrf_token %}
    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input type="text" name="nombre" id="nombre" value="{{ tipo.nombre }}" required>
    </div>
    <div class="form-group">
      <label for="descripcion">Descripción:</label>
      <textarea name="descripcion" id="descripcion" rows="3">{{ tipo.descripcion }}</textarea>
    </div>
    <div class="form-group">
      <label for="id_direccion">Dirección asociada:</label>
      <select name="direccion" id="id_direccion" required>
        {% for dir in direcciones %}
          <option value="{{ dir.id }}" {% if dir.id == tipo.direccion.id %}selected{% endif %}>{{ dir.nombre_direccion }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="id_departamento">Departamento asociado:</label>
      <select name="departamento" id="id_departamento" required>
        {% for dep in departamentos %}
          <option value="{{ dep.id }}" {% if dep.id == tipo.departamento.id %}selected{% endif %}>{{ dep.nombre_departamento }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-editar">Guardar Cambios</button>
      <a href="{% url 'listar_tipos_incidencia' %}" class="btn btn-volver">Cancelar</a>
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const direccionSelect = document.querySelector('#id_direccion');
    const departamentoSelect = document.querySelector('#id_departamento');
    const url = "{% url 'api_departamentos' %}";

    direccionSelect.addEventListener('change', function() {
        const direccionId = this.value;
        departamentoSelect.innerHTML = '<option value="">Cargando...</option>';

        if (direccionId) {
            fetch(`${url}?direccion_id=${direccionId}`)
                .then(response => response.json())
                .then(data => {
                    departamentoSelect.innerHTML = '<option value="">Seleccione departamento</option>';
                    data.forEach(dep => {
                        departamentoSelect.add(new Option(dep.nombre, dep.id));
                    });
                })
                .catch(error => {
                    departamentoSelect.innerHTML = '<option value="">Error al cargar</option>';
                });
        } else {
            departamentoSelect.innerHTML = '<option value="">Seleccione una dirección primero</option>';
        }
    });
});
</script>
{% endblock %}
